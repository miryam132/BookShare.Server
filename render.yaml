# Free tier only, explicitly requested. Check usage/billing controls before applying.
services:
  - type: web
    name: bookshare-api
    runtime: docker
    plan: free
    region: frankfurt
    autoDeployTrigger: 'off'
    healthCheckPath: /api/health/database
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Hosting__BehindTlsProxy
        value: true
      - key: ConnectionStrings__BookShare
        sync: false
      - key: Jwt__SigningKey
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
